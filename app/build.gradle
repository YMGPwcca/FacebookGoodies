plugins { id 'com.android.application' }
android {
    namespace 'ymg.pwcca.facebookgoodies'
    compileSdk 36
    defaultConfig {
        applicationId 'ymg.pwcca.facebookgoodies'
        minSdk 28
        targetSdk 36
        versionCode 21
        versionName '1.3.5'
        testInstrumentationRunner 'ymg.pwcca.facebookgoodies.DownloadInstrumentation'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}
dependencies {
    implementation('org.mp4parser:muxer:1.9.56') { exclude group: 'junit', module: 'junit' }
    implementation 'org.slf4j:slf4j-nop:1.8.0-beta4'
    compileOnly files('libs/xposed-api-82.jar')
    testImplementation 'junit:junit:4.13.2'
}
